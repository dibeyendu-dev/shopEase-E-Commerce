<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/order-success.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="container">

            <nav class="navbar">

                <a href="index.html" class="logo">

                    Shop<span>Ease</span>

                </a>

                <button class="menu-toggle">

                    ☰

                </button>

                <ul class="nav-links">

                    <li><a href="index.html">Home</a></li>

                    <li><a href="products.html">Products</a></li>

                    <li><a href="categories.html">Categories</a></li>

                    <li><a href="offers.html">Offers</a></li>

                    <li><a href="contact.html">Contact</a></li>

                </ul>

                <div class="nav-actions">

                    <a href="login.html" class="login-nav-btn">

                        <i class="fa-regular fa-user"></i>

                        Login

                    </a>

                    <a href="wishlist.html" class="icon-btn">

                        <i class="fa-regular fa-heart"></i>

                        <span id="wishlistCount" class="cart-count">

                            0

                        </span>

                    </a>

                    <a href="cart.html" class="icon-btn cart-btn">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <span id="cartCount" class="cart-count">

                            0

                        </span>

                    </a>

                </div>

            </nav>

        </div>

    </header>

    <section class="success-section">

        <div class="container">

            <div class="success-card">

                <div class="success-icon">

                    <i class="fa-solid fa-circle-check"></i>

                </div>

                <h1>

                    Order Placed Successfully!

                </h1>

                <p>

                    Thank you for shopping with ShopEase.
                    Your order has been confirmed.

                </p>

                <div class="order-info">

                    <p>

                        <strong>Order ID :</strong>

                        <span id="orderId"></span>

                    </p>

                    <p>

                        <strong>Order Date :</strong>

                        <span id="orderDate"></span>

                    </p>

                    <p>

                        <strong>Total Amount :</strong>

                        <span id="orderAmount"></span>

                    </p>

                </div>

                <div class="success-buttons">

                    <a href="products.html" class="shop-btn">

                        Continue Shopping

                    </a>

                    <a href="index.html" class="home-btn">

                        Back To Home

                    </a>

                </div>

            </div>

        </div>

    </section>

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>

                    © 2026 ShopEase. All Rights Reserved.

                </p>

            </div>

        </div>

    </footer>

    <script src="js/order-success.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>

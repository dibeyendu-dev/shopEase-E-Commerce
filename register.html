<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Register | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="container">

            <nav class="navbar">

                <a href="index.html" class="logo">

                    Shop<span>Ease</span>

                </a>

                <button class="menu-toggle">

                    ☰

                </button>

                <ul class="nav-links">

                    <li><a href="index.html">Home</a></li>

                    <li><a href="products.html">Products</a></li>

                    <li><a href="categories.html">Categories</a></li>

                    <li><a href="offers.html">Offers</a></li>

                    <li><a href="contact.html">Contact</a></li>

                </ul>

                <div class="nav-actions">

                    <a href="login.html" class="login-nav-btn">

                        <i class="fa-regular fa-user"></i>

                        Login

                    </a>

                    <a href="wishlist.html" class="icon-btn">

                        <i class="fa-regular fa-heart"></i>

                        <span id="wishlistCount" class="cart-count">

                            0

                        </span>

                    </a>

                    <a href="cart.html" class="icon-btn cart-btn">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <span id="cartCount" class="cart-count">

                            0

                        </span>

                    </a>

                </div>

            </nav>

        </div>

    </header>

    <section class="register-section">

        <div class="container">

            <div class="register-card">

                <h2>

                    Create Your Account

                </h2>

                <p>

                    Join ShopEase and start shopping today.

                </p>

                <form id="registerForm">

                    <div class="input-group">

                        <label>Full Name</label>

                        <input type="text" id="name" placeholder="Enter your full name" required>

                    </div>

                    <div class="input-group">

                        <label>Email</label>

                        <input type="email" id="email" placeholder="Enter your email" required>

                    </div>
                    <div class="input-group">

                        <label>Phone Number</label>

                        <input type="tel" id="phone" placeholder="Enter your phone number" maxlength="10" required>

                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <div class="password-box">

                            <input type="password" id="password" placeholder="Create password" required>

                            <i class="fa-solid fa-eye" id="togglePassword"></i>

                        </div>

                    </div>

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <div class="password-box">

                            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                            <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

                        </div>


                    </div>
                    <div class="terms-box">

                        <label>

                            <input type="checkbox" id="terms">

                            I agree to the

                            <a href="#">

                                Terms & Conditions

                            </a>

                        </label>

                    </div>

                    <button type="submit" class="register-btn">

                        Create Account

                    </button>

                    <p class="login-link">

                        Already have an account?

                        <a href="login.html">

                            Login

                        </a>

                    </p>

                </form>

            </div>

        </div>

    </section>

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>

                    © 2026 ShopEase. All Rights Reserved.

                </p>

            </div>

        </div>

    </footer>

    <script src="js/register.js"></script>

</body>

</html>
